name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar código-fonte
        run: |
          mkdir -p out
          javac -encoding UTF-8 -d out $(find src -name '*.java')
